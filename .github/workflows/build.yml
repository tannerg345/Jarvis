name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build JARVIS.app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Unit tests
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-${{ github.sha }}
          path: build/JARVIS.zip
          retention-days: 30

      - name: Publish release (once per version in VERSION)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          NOTES="docs/releases/${TAG}.md"
          [ -f "$NOTES" ] || NOTES="docs/releases/default.md"
          gh release create "$TAG" build/JARVIS.zip \
            --target "$GITHUB_SHA" \
            --title "JARVIS $TAG" \
            --notes-file "$NOTES"
