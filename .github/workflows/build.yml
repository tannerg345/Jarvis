name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build JARVIS.app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Unit tests
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh "$GITHUB_REF_NAME"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-${{ github.sha }}
          path: build/JARVIS.zip
          retention-days: 30

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || NOTES="docs/releases/default.md"
          gh release create "$GITHUB_REF_NAME" build/JARVIS.zip \
            --title "JARVIS $GITHUB_REF_NAME" \
            --notes-file "$NOTES"
